<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Editor — Command Palette</title>
<style>
:root{
  --bg:#07111f;--panel:rgba(15,28,48,.72);--panel2:rgba(10,20,35,.86);
  --text:#edf6ff;--muted:#91a5bb;--border:rgba(255,255,255,.12);
  --cyan:#6ee7f9;--violet:#8b5cf6;--green:#5eead4;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);
  background:
    radial-gradient(ellipse 50% 35% at 50% 5%,rgba(110,231,249,.18),transparent 70%),
    radial-gradient(circle at 85% 20%,rgba(139,92,246,.14),transparent 30%),
    linear-gradient(180deg,#081722 0%,#07111f 55%,#030913 100%);
  min-height:100vh;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:40px 40px;
}
header{
  position:sticky;top:0;z-index:10;padding:18px 24px;
  backdrop-filter:blur(20px);background:rgba(4,12,22,.72);
  border-bottom:1px solid var(--border);
}
.top{max-width:1400px;margin:auto;display:flex;align-items:center;gap:16px}
.logo{font-size:20px;font-weight:800;white-space:nowrap}
.logo span{color:var(--cyan)}
.search{
  flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:11px 14px;
}
.search input{width:100%;background:none;border:0;outline:0;color:white;font-size:15px}
kbd{background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--muted)}
main{max-width:1400px;margin:0 auto;padding:28px 24px 60px}
.hero{margin-bottom:26px}
.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,46px)}
.hero p{color:var(--muted);margin:0;max-width:760px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
button,.filter{
  cursor:pointer;color:var(--text);background:var(--panel);border:1px solid var(--border);
  border-radius:11px;padding:9px 13px;transition:.2s;
}
button:hover,.filter:hover,.filter.active{border-color:rgba(110,231,249,.55);background:rgba(110,231,249,.09)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:20px}
.sidebar,.content,.command{
  background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);
}
.sidebar{border-radius:20px;padding:14px;height:max-content;position:sticky;top:92px}
.sidebar h3{font-size:12px;text-transform:uppercase;color:var(--muted);margin:10px 10px}
.cat{display:block;width:100%;text-align:left;border:0;background:transparent;margin:3px 0}
.cat.active{background:rgba(110,231,249,.1);color:var(--cyan)}
.content{border-radius:20px;padding:18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 16px}
.section-title h2{margin:0;font-size:20px}
.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.command{
  border-radius:15px;padding:15px;transition:.2s;background:rgba(7,17,31,.58)
}
.command:hover{transform:translateY(-2px);border-color:rgba(110,231,249,.3)}
.cmd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cmd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan);font-weight:700}
.num{font-size:11px;color:var(--muted)}
.desc{font-size:13px;color:var(--muted);margin:9px 0}
.example{
  font-family:ui-monospace,monospace;font-size:12px;color:#d8e6f3;
  background:rgba(0,0,0,.25);padding:9px;border-radius:9px;overflow:auto
}
.copy{font-size:12px;padding:6px 9px}
.empty{padding:50px;text-align:center;color:var(--muted);display:none}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}.sidebar{position:static}
 .sidebar .cats{display:grid;grid-template-columns:repeat(2,1fr)}
 .top{flex-wrap:wrap}.search{order:3;flex-basis:100%}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">✨ <span>AI</span> Image Editor</div>
    <div class="search">⌕
      <input id="search" placeholder="Rechercher une commande…  ex. remove, upscale, portrait">
      <kbd>/</kbd>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Command Palette</h1>
    <p>140 commandes pour un éditeur d’images inspiré de Photoshop, Canva et des outils IA génératifs.</p>
  </section>

  <div class="toolbar">
    <button class="filter active" data-filter="all">Toutes</button>
    <button class="filter" data-filter="core">Core</button>
    <button class="filter" data-filter="transform">Transform</button>
    <button class="filter" data-filter="retouch">Retouche</button>
    <button class="filter" data-filter="color">Couleur</button>
    <button class="filter" data-filter="ai">IA</button>
    <button class="filter" data-filter="design">Design</button>
    <button class="filter" data-filter="export">Export</button>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h3>Catégories</h3>
      <div class="cats" id="categories"></div>
    </aside>

    <section class="content">
      <div class="section-title">
        <h2 id="title">Toutes les commandes</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">Aucune commande trouvée.</div>
    </section>
  </div>

  <footer>AI Image Editor Command Palette · /commande cible --paramètre valeur</footer>
</main>

["/perspective","Corriger la perspective","/perspective auto"],["/warp","Déformer","/warp subtle"],["/distort","Distorsion","/distort perspective"],

["/heal","Corriger une imperfection","/heal imperfection"],["/clone","Cloner une zone","/clone zone1 zone2"],
["/patch","Réparer une zone","/patch tache"],["/decontaminate","Nettoyer les contours","/decontaminate edges"],
["/denoise","Réduire le bruit","/denoise 40"],["/deblur","Réduire le flou","/deblur medium"],

["/vignette","Vignette","/vignette 20"],["/hdr","Rendu HDR","/hdr 30"]
]],

["/sky","Modifier le ciel","/sky coucher de soleil"],["/sky-replace","Remplacer le ciel","/sky-replace dramatic"],
["/depth","Profondeur","/depth +30"],["/background-match","Harmoniser le décor","/background-match cinematic"]
]],

["/fill","Remplissage IA","/fill sélection paysage"],["/generative-fill","Generative Fill","/generative-fill wooden table"],
["/generative-expand","Generative Expand","/generative-expand top"],["/add","Ajouter un objet","/add vase"],
["/replace","Remplacer un objet","/replace chair sofa"],["/reconstruct","Reconstruire une zone","/reconstruct missing area"],
["/variation","Créer des variations","/variation 4"],["/remix","Remixer","/remix futuristic"],
["/restyle","Restyler","/restyle watercolor"],["/style-transfer","Transfert de style","/style-transfer comic"],
["/semantic-edit","Édition sémantique","/semantic-edit make it winter"]
]],
["Styles","styles",[
["/anime","Style anime","/anime soft cinematic"],["/cartoon","Style cartoon","/cartoon modern"],
["/comic","Style comic","/comic superhero"],["/sketch","Croquis","/sketch pencil"],
["/ink","Encre","/ink black-white"],["/watercolor","Aquarelle","/watercolor soft"],
["/oilpaint","Peinture à l’huile","/oilpaint classical"],["/pixelart","Pixel art","/pixelart 16bit"],
["/3d","Rendu 3D","/3d realistic"],["/clay","Rendu clay","/clay render"],
["/neon","Style néon","/neon cyberpunk"],["/vintage","Vintage","/vintage 1970s"],
["/retro","Retro","/retro poster"],["/minimal","Minimaliste","/minimal editorial"],["/cinematic","Cinématique","/cinematic movie still"]
]],
["Photographie","photo",[
["/photo","Optimiser une photo","/photo professional"],["/studio","Photo studio","/studio product photography"],
["/product","Photo produit","/product ecommerce"],["/macro","Macro","/macro detailed"],
["/landscape","Paysage","/landscape HDR"],["/street","Street photography","/street photography"],
["/architecture","Architecture","/architecture corrected"],["/night","Photo de nuit","/night photography"],
["/long-exposure","Pose longue","/long-exposure effect"],["/depth-of-field","Profondeur de champ","/depth-of-field shallow"]
]],
["Restauration","restore",[
["/restore","Restaurer","/restore high"],["/restore-photo","Restaurer une photo","/restore-photo"],
["/restore-color","Restaurer les couleurs","/restore-color"],["/colorize","Coloriser","/colorize natural"],
["/upscale","Upscaling","/upscale 4x"],["/superres","Super-résolution","/superres 4x"],
["/enhance","Améliorer","/enhance detail"],["/face-enhance","Améliorer un visage","/face-enhance 30"],
["/detail","Récupérer les détails","/detail +25"],["/recover","Récupérer les zones","/recover shadows"]
]],
["Design / Canva","design",[
["/design","Créer une composition","/design poster moderne"],["/layout","Mise en page","/layout balanced"],
["/align","Aligner","/align center"],["/distribute","Distribuer","/distribute horizontal"],
["/grid","Créer une grille","/grid 3x3"],["/margin","Marges","/margin 40"],
["/spacing","Espacement","/spacing 20"],["/guides","Guides","/guides on"],
["/safe-area","Zone sûre","/safe-area social"],["/template","Appliquer un modèle","/template instagram"],
["/brand","Identité de marque","/brand mybrand"],["/mockup","Créer un mockup","/mockup smartphone"],
["/poster","Créer une affiche","/poster event"],["/flyer","Créer un flyer","/flyer promotion"],
["/banner","Créer une bannière","/banner website"]
]],
["Texte","text",[
["/text","Ajouter du texte","/text \"Summer Sale\""],["/font","Changer la police","/font Inter"],
["/font-size","Taille","/font-size 48"],["/font-weight","Graisse","/font-weight 700"],
["/tracking","Espacement des lettres","/tracking 2"],["/leading","Interligne","/leading 1.4"],
["/text-align","Alignement","/text-align center"],["/text-color","Couleur","/text-color #FFFFFF"],
["/text-shadow","Ombre du texte","/text-shadow soft"],["/outline","Contour","/outline 2px"],
["/warp-text","Déformer le texte","/warp-text arc"],["/text-effect","Effet texte","/text-effect neon"]
]],
["Calques","layers",[
["/layer","Gérer un calque","/layer subject"],["/new-layer","Nouveau calque","/new-layer"],
["/rename-layer","Renommer","/rename-layer Background"],["/hide-layer","Masquer","/hide-layer Background"],
["/show-layer","Afficher","/show-layer Background"],["/lock-layer","Verrouiller","/lock-layer Logo"],
["/opacity","Opacité","/opacity 75"],["/blend","Mode de fusion","/blend multiply"],
["/group","Grouper","/group layer1 layer2"],["/ungroup","Dégrouper","/ungroup group1"],
["/move-layer","Déplacer un calque","/move-layer up"],["/merge-down","Fusionner vers le bas","/merge-down"]
]],

["/chromatic","Aberration chromatique","/chromatic subtle"],["/duotone","Duo-ton","/duotone blue-orange"],
["/halftone","Demi-teinte","/halftone comic"],["/pixelate","Pixelliser","/pixelate 10"],["/posterize","Posteriser","/posterize 6"]
]],
["Réseaux sociaux","social",[

["/reel","Reel","/reel"],["/post","Post","/post"],["/facebook","Facebook","/facebook"],
["/youtube","YouTube","/youtube --resolution 1920x1080"],["/thumbnail","Miniature","/thumbnail --style bold"],
["/tiktok","TikTok","/tiktok"],["/linkedin","LinkedIn","/linkedin"],["/twitter","X/Twitter","/twitter"],
["/pinterest","Pinterest","/pinterest"],["/whatsapp","WhatsApp","/whatsapp"]
]],

["/detect-text","Détecter le texte","/detect-text"],["/ocr","Extraire le texte","/ocr"],
["/colors","Extraire la palette","/colors"],["/composition","Analyser la composition","/composition"],
["/quality","Analyser la qualité","/quality"],["/lighting","Analyser l’éclairage","/lighting"],

]],
["Export","export",[

["/download","Télécharger","/download png"],["/jpg","JPEG","/jpg quality=90"],
["/png","PNG","/png transparent=true"],["/webp","WebP","/webp quality=85"],
["/pdf","PDF","/pdf print"],["/svg","SVG","/svg"],["/quality","Qualité","/quality 95"],

let commands=[], current="all";
let n=0;
sections.forEach(([name,cat,items])=>items.forEach(x=>commands.push({name,cat,id:++n,cmd:x[0],desc:x[1],example:x[2]})));

const categories=document.getElementById("categories");
const grid=document.getElementById("grid");
const search=document.getElementById("search");
const title=document.getElementById("title");
const count=document.getElementById("count");
const empty=document.getElementById("empty");

function render(){
  const q=search.value.toLowerCase().trim();
  const data=commands.filter(x=>
    (current==="all"||x.cat===current) &&
    (!q || [x.cmd,x.desc,x.example,x.name].join(" ").toLowerCase().includes(q))
  );
  grid.innerHTML="";
  data.forEach(x=>{
    const el=document.createElement("article");
    el.className="command";
    el.innerHTML=`<div class="cmd-top"><span class="cmd">${x.cmd}</span>
      <span class="num">#${String(x.id).padStart(3,"0")}</span></div>
      <div class="desc">${x.desc} · ${x.name}</div>
      <div class="example">${escapeHtml(x.example)} <button class="copy" title="Copier">Copier</button></div>`;
    el.querySelector(".copy").onclick=()=>navigator.clipboard?.writeText(x.example);
    grid.appendChild(el);
  });
  title.textContent=current==="all"?"Toutes les commandes":sections.find(x=>x[1]===current)?.[0]||"Commandes";
  count.textContent=`${data.length} commande${data.length>1?"s":""}`;
  empty.style.display=data.length?"none":"block";
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

categories.innerHTML=`<button class="cat active" data-cat="all">✨ Toutes (${commands.length})</button>`+
  sections.map(s=>`<button class="cat" data-cat="${s[1]}">${s[0]} (${s[2].length})</button>`).join("");

categories.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
  categories.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");current=b.dataset.cat;render();
});
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");current=b.dataset.filter;render();
  categories.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x.dataset.cat===current));
});
search.oninput=render;
document.addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement!==search){e.preventDefault();search.focus();}
  if(e.key==="Escape"){search.value="";search.blur();render();}
});
render();
</script>
</body>
</html>
