<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Modern Animated Navbar</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>*{    margin:0;    padding:0;    box-sizing:border-box;}html{    scroll-behavior:smooth;}body{    font-family:Inter,sans-serif;    background:#090909;    color:white;    overflow-x:hidden;}/* Animated Background */body::before{    content:"";    position:fixed;    inset:0;    background:    radial-gradient(circle at 20% 20%,rgba(0,200,255,.12),transparent 30%),    radial-gradient(circle at 80% 60%,rgba(255,0,120,.10),transparent 35%),    radial-gradient(circle at center,#111,#090909);    animation:bgMove 12s linear infinite alternate;    z-index:-2;}@keyframes bgMove{0%{transform:scale(1);filter:hue-rotate(0deg);}100%{transform:scale(1.15);filter:hue-rotate(40deg);}}/* Navbar */nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);width:min(92%,1100px);display:flex;justify-content:space-between;align-items:center;padding:16px 30px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:60px;box-shadow:0 0 40px rgba(0,0,0,.35);z-index:1000;animation:slideDown .8s ease;}@keyframes slideDown{from{opacity:0;transform:translate(-50%,-60px);}to{opacity:1;transform:translate(-50%,0);}}.logo{font-size:1.5rem;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#00d9ff,#7b61ff,#ff4ecd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}/* Menu */.menu{display:flex;gap:15px;list-style:none;}.menu li{position:relative;}.menu a{display:block;padding:12px 22px;text-decoration:none;color:white;font-weight:500;transition:.35s;position:relative;overflow:hidden;}/* Hover background */.menu a::before{content:"";position:absolute;left:50%;top:50%;width:0;height:0;background:rgba(255,255,255,.08);border-radius:50%;transform:translate(-50%,-50%);transition:.45s;}.menu a:hover::before{width:220px;height:220px;}.menu a span{position:relative;z-index:2;}/* Animated underline */.menu a::after{content:"";position:absolute;left:18px;right:18px;bottom:7px;height:3px;background:linear-gradient(90deg,#00d9ff,#7b61ff,#ff4ecd);border-radius:20px;transform:scaleX(0);transform-origin:left;transition:.4s;}.menu a:hover::after{transform:scaleX(1);}/* Glow */.menu a:hover{color:#fff;text-shadow:0 0 10px #00d9ff,0 0 25px #7b61ff;}/* Mobile Button */.toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;}.toggle span{width:28px;height:3px;background:white;transition:.4s;}/* Sections */section{height:100vh;display:flex;justify-content:center;align-items:center;font-size:4rem;font-weight:bold;}#home{background:transparent;}#about{background:#111;}#services{background:#181818;}#portfolio{background:#111;}#contact{background:#181818;}/* Responsive */@media(max-width:850px){.toggle{display:flex;}.menu{position:absolute;top:90px;left:0;right:0;flex-direction:column;background:#111;border-radius:25px;padding:20px;display:none;animation:fade .4s;}.menu.active{display:flex;}}@keyframes fade{from{opacity:0;transform:translateY(-15px);}to{opacity:1;transform:translateY(0);}}</style></head><body><nav><div class="logo">MIRAGE</div><ul class="menu"><li><a href="#home"><span>Home</span></a></li><li><a href="#about"><span>About</span></a></li><li><a href="#services"><span>Services</span></a></li><li><a href="#portfolio"><span>Portfolio</span></a></li><li><a href="#contact"><span>Contact</span></a></li></ul><div class="toggle"><span></span><span></span><span></span></div></nav><section id="home">HOME</section><section id="about">ABOUT</section><section id="services">SERVICES</section><section id="portfolio">PORTFOLIO</section><section id="contact">CONTACT</section><script>const toggle=document.querySelector(".toggle");const menu=document.querySelector(".menu");toggle.onclick=()=>{menu.classList.toggle("active");};// Close mobile menu after clickdocument.querySelectorAll(".menu a").forEach(link=>{link.addEventListener("click",()=>{menu.classList.remove("active");});});// Navbar blur while scrollingwindow.addEventListener("scroll",()=>{const nav=document.querySelector("nav");if(window.scrollY>50){nav.style.background="rgba(20,20,20,.75)";nav.style.boxShadow="0 0 40px rgba(0,0,0,.55)";}else{nav.style.background="rgba(255,255,255,.06)";nav.style.boxShadow="0 0 40px rgba(0,0,0,.35)";}});</script></body></html>
