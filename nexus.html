<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Glassmorphism Navbar</title>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(18, 18, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-glow: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(0, 229, 255, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #00e5ff;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 200vh; /* For scrolling demonstration */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(147, 51, 234, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* --- Header & Navbar Layout --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 24px;
            z-index: 1000;
        }

        .navbar {
            width: 100%;
            max-width: 1200px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-radius: 20px;

            /* Glassmorphism Effect */
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            
            transition: all var(--transition-speed) ease;
        }

        /* Ambient hover effect on navbar frame */
        .navbar:hover {
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6),
                        0 0 20px var(--glass-glow),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* --- Brand Logo --- */
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform var(--transition-speed) ease;
        }

        .logo span {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .logo:hover {
            transform: scale(1.03);
        }

        /* --- Desktop Navigation Links --- */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 4px;
            display: block;
            position: relative;
            transition: color var(--transition-speed) ease, text-shadow var(--transition-speed) ease;
        }

        /* Animated Underline */
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            box-shadow: 0 0 8px var(--accent-color);
            border-radius: 2px;
            transform: translateX(-50%);
            transition: width var(--transition-speed) cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Hover Glow & Underline Trigger */
        .nav-link:hover {
            color: var(--text-main);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        .nav-link:hover::after,
        .nav-item.active .nav-link::after {
            width: 100%;
        }

        .nav-item.active .nav-link {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Call-to-Action Button */
        .cta-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .cta-btn:hover {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* --- Hamburger Menu Toggle --- */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1001;
        }

        .menu-toggle .bar {
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: all var(--transition-speed) ease;
        }

        /* Hidden checkbox state for pure CSS interactive mobile toggle */
        #nav-check {
            display: none;
        }

        /* --- Responsive Styles (Mobile & Tablet) --- */
        @media (max-width: 868px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: absolute;
                top: 80px;
                left: 0;
                right: 0;
                width: 100%;
                flex-direction: column;
                gap: 20px;
                padding: 30px 0;
                border-radius: 20px;

                /* Mobile Glassmorphism Panel */
                background: rgba(12, 12, 14, 0.92);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--glass-border);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);

                /* Hidden Off-screen State */
                opacity: 0;
                visibility: hidden;
                transform: translateY(-15px) scale(0.98);
                transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            }

            /* Toggle Animated Mobile Menu State via Checkbox */
            #nav-check:checked ~ .nav-links {
                opacity: 1;
                visibility: visible;
                transform: translateY(0) scale(1);
            }

            /* Animated Hamburger Transformation to 'X' */
            #nav-check:checked ~ .menu-toggle .bar:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }

            #nav-check:checked ~ .menu-toggle .bar:nth-child(2) {
                opacity: 0;
                transform: translateX(-10px);
            }

            #nav-check:checked ~ .menu-toggle .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }

            .nav-link {
                font-size: 1.1rem;
            }
            .accordion{
display:flex;
flex-direction:column;
gap:18px;
}

.accordion-item{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(18px);
border-radius:18px;
overflow:hidden;
}

.accordion-title{
width:100%;
background:none;
border:none;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
color:#fff;
font-size:18px;
font-weight:600;
}

.icon{
font-size:24px;
transition:.3s;
}

.accordion-item.active .icon{
transform:rotate(45deg);
}

.accordion-body{
max-height:0;
overflow:hidden;
transition:.4s;
padding:0 20px;
}

.accordion-item.active .accordion-body{
max-height:900px;
padding:20px;
}

.accordion textarea{
width:100%;
height:260px;
resize:vertical;
padding:15px;
background:#111;
color:#fff;
border-radius:12px;
border:1px solid #333;
font-family:Consolas,monospace;
line-height:1.5;
}

.copy-btn{
margin-top:15px;
padding:10px 18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00e5ff;
font-weight:bold;
}
        }
    </style>
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="#" class="logo">
                NEXUS<span>.</span>
            </a>

            <!-- Hidden Checkbox Controller for Pure HTML/CSS Toggle -->
            <input type="checkbox" id="nav-check">

            <label for="nav-check" class="menu-toggle" aria-label="Toggle navigation menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </label>

            <ul class="nav-links">
                <li class="nav-item active"><a href="#home" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#features" class="nav-link">Features</a></li>
                <li class="nav-item"><a href="#projects" class="nav-link">Projects</a></li>
                <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#contact" class="cta-btn">Get Started</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
