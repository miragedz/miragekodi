<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bac 2020 Dashboard – Experimental Sciences</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f4f7fc;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .dashboard {
            max-width: 1440px;
            width: 100%;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #0b2a4a, #1a4b6d);
            color: #fff;
            border-radius: 20px;
            padding: 28px 36px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(11, 42, 74, 0.25);
        }
        .header-left h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header-left h1 i {
            margin-right: 12px;
            color: #f9d976;
        }
        .header-left .sub {
            font-size: 15px;
            opacity: 0.85;
            margin-top: 6px;
            font-weight: 400;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header-left .sub span i {
            margin-right: 6px;
            opacity: 0.7;
        }
        .header-badge {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }
        .header-badge .year {
            font-weight: 700;
            font-size: 20px;
            color: #f9d976;
        }

        /* ── Stats Cards ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9eef4;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
        }
        .stat-card .label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #6b7a8f;
            margin-bottom: 6px;
        }
        .stat-card .value {
            font-size: 30px;
            font-weight: 700;
            color: #0b2a4a;
        }
        .stat-card .value .unit {
            font-size: 16px;
            font-weight: 400;
            color: #6b7a8f;
            margin-left: 4px;
        }
        .stat-card .icon {
            float: right;
            font-size: 28px;
            color: #d0dbe8;
            margin-top: -2px;
        }
        .stat-card.accent .value {
            color: #1a6b8a;
        }
        .stat-card.accent .icon {
            color: #1a6b8a;
        }
        .stat-card.gold .value {
            color: #b8860b;
        }
        .stat-card.gold .icon {
            color: #b8860b;
        }
        .stat-card.green .value {
            color: #2a7d4f;
        }
        .stat-card.green .icon {
            color: #2a7d4f;
        }

        /* ── Charts Row ── */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-box {
            background: #fff;
            border-radius: 16px;
            padding: 20px 20px 12px;
            border: 1px solid #e9eef4;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .chart-box h3 {
            font-size: 15px;
            font-weight: 600;
            color: #1e2f40;
            margin-bottom: 6px;
        }
        .chart-box .chart-container {
            position: relative;
            height: 210px;
        }

        /* ── Filters ── */
        .filters-bar {
            background: #fff;
            border-radius: 16px;
            padding: 16px 22px;
            border: 1px solid #e9eef4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .filters-bar .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filters-bar .filter-group label {
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
        }
        .filters-bar .filter-group select,
        .filters-bar .filter-group input {
            padding: 7px 14px;
            border-radius: 30px;
            border: 1px solid #dce3ec;
            background: #f8fafc;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
            min-width: 110px;
        }
        .filters-bar .filter-group select:focus,
        .filters-bar .filter-group input:focus {
            border-color: #1a4b6d;
            box-shadow: 0 0 0 3px rgba(26, 75, 109, 0.12);
        }
        .filters-bar .filter-group input {
            min-width: 150px;
        }
        .filters-bar .reset-btn {
            margin-left: auto;
            background: #eef2f7;
            border: none;
            padding: 7px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #1e3a5a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filters-bar .reset-btn:hover {
            background: #dce3ec;
        }

        /* ── Table ── */
        .table-wrapper {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e9eef4;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .table-scroll {
            overflow-x: auto;
            padding: 0 4px 4px 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 700px;
        }
        thead {
            background: #f0f4fa;
            border-bottom: 2px solid #dce3ec;
        }
        thead th {
            padding: 14px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #2c3e50;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: #f0f4fa;
            z-index: 2;
        }
        thead th i {
            margin-left: 6px;
            opacity: 0.5;
            font-size: 11px;
        }
        thead th:hover {
            color: #0b2a4a;
        }
        tbody tr {
            border-bottom: 1px solid #eef3f8;
            transition: background 0.15s;
        }
        tbody tr:hover {
            background: #f6f9fe;
        }
        tbody td {
            padding: 12px 14px;
            vertical-align: middle;
        }
        .rank-badge {
            display: inline-block;
            font-weight: 700;
            font-size: 13px;
            color: #1e2f40;
            background: #eef3f8;
            border-radius: 30px;
            padding: 0 10px;
            min-width: 32px;
            text-align: center;
            line-height: 26px;
        }
        .rank-badge.top1 {
            background: #f9d976;
            color: #7a5f0a;
        }
        .rank-badge.top2 {
            background: #dce3ec;
            color: #1e2f40;
        }
        .rank-badge.top3 {
            background: #e6c9a8;
            color: #6b4f2e;
        }
        .grade-pill {
            display: inline-block;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 13px;
            background: #eef3f8;
            color: #1e2f40;
        }
        .grade-pill.excellent {
            background: #d4edda;
            color: #155724;
        }
        .grade-pill.good {
            background: #cce5ff;
            color: #004085;
        }
        .grade-pill.pass {
            background: #fff3cd;
            color: #856404;
        }
        .grade-pill.low {
            background: #f8d7da;
            color: #721c24;
        }
        .mention-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 30px;
            display: inline-block;
            background: #eef3f8;
            color: #1e2f40;
        }
        .mention-badge.good {
            background: #cce5ff;
            color: #004085;
        }
        .mention-badge.pass {
            background: #fff3cd;
            color: #856404;
        }
        .student-name {
            font-weight: 600;
            color: #0b2a4a;
        }
        .student-surname {
            color: #2c3e50;
        }
        .empty-row td {
            padding: 40px 20px;
            text-align: center;
            color: #6b7a8f;
            font-style: italic;
        }

        /* ── Footer ── */
        .footer-note {
            margin-top: 20px;
            text-align: right;
            font-size: 13px;
            color: #8a9aa8;
            padding-right: 6px;
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 22px 24px;
            }
            .header-badge {
                align-self: stretch;
                text-align: center;
            }
            .filters-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filters-bar .reset-btn {
                margin-left: 0;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header-left h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

                </div>

                    </thead>
                    <tbody id="tableBody">

            </div>

            if (grade >= 14) return 'excellent';
            if (grade >= 12) return 'good';
            if (grade >= 10) return 'pass';
            return 'low';
        }

        function formatDate(d) {
            const parts = d.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER STATS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderStats(data) {
            const n = data.length;
            const grades = data.map(d => d.grade);
            const avg = grades.reduce((a, b) => a + b, 0) / n || 0;
            const min = Math.min(...grades);
            const max = Math.max(...grades);
            const pass = data.filter(d => d.mention === 'مفبول').length;
            const good = data.filter(d => d.mention === 'جيد').length;

            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card accent">
                    <div class="icon"><i class="fas fa-users"></i></div>
                    <div class="label">Total candidats</div>
                    <div class="value">${n}</div>
                </div>
                <div class="stat-card">
                    <div class="icon"><i class="fas fa-chart-line"></i></div>
                    <div class="label">Moyenne générale</div>
                    <div class="value">${avg.toFixed(2)}<span class="unit">/20</span></div>
                </div>
                <div class="stat-card gold">
                    <div class="icon"><i class="fas fa-arrow-up"></i></div>
                    <div class="label">Meilleure note</div>
                    <div class="value">${max.toFixed(2)}<span class="unit">/20</span></div>
                </div>
                <div class="stat-card green">
                    <div class="icon"><i class="fas fa-arrow-down"></i></div>
                    <div class="label">Note la plus basse</div>
                    <div class="value">${min.toFixed(2)}<span class="unit">/20</span></div>
                </div>
                <div class="stat-card" style="border-left:4px solid #f9d976;">
                    <div class="icon"><i class="fas fa-star"></i></div>
                    <div class="label">Mention <span style="font-weight:400;">جيد</span></div>
                    <div class="value">${good}</div>
                </div>
                <div class="stat-card" style="border-left:4px solid #8ab8d9;">
                    <div class="icon"><i class="fas fa-check-circle"></i></div>
                    <div class="label">Mention <span style="font-weight:400;">مفبول</span></div>
                    <div class="value">${pass}</div>
                </div>
            `;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER TABLE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Aucun résultat ne correspond à vos critères</td></tr>`;
                return;
            }
            let html = '';
            data.forEach(d => {
                const gradeClass = getGradePillClass(d.grade);
                const mentionCls = getMentionClass(d.mention);
                html += `
                    <tr>
                        <td><span class="${rankBadge(d.rank)}">${d.rank}</span></td>
                        <td style="font-weight:500;color:#1e2f40;">${d.id}</td>
                        <td class="student-surname">${d.surname}</td>
                        <td class="student-name">${d.firstname}</td>
                        <td style="font-size:13px;color:#4a5b6b;">${formatDate(d.birth)}</td>
                        <td><span class="grade-pill ${gradeClass}">${d.grade.toFixed(2)}</span></td>
                        <td><span class="mention-badge ${mentionCls}">${d.mention}</span></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  FILTER & SORT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function filterData() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const mention = document.getElementById('mentionFilter').value;
            const minGrade = parseFloat(document.getElementById('minGradeFilter').value) || 0;

            let filtered = rawData.filter(d => {
                // search
                if (search) {
                    const full = `${d.surname} ${d.firstname} ${d.id}`.toLowerCase();
                    if (!full.includes(search)) return false;
                }
                // mention
                if (mention !== 'all' && d.mention !== mention) return false;
                // min grade
                if (d.grade < minGrade) return false;
                return true;
            });

            // sort
            filtered.sort((a, b) => {
                let va = a[sortKey];
                let vb = b[sortKey];
                if (sortKey === 'grade' || sortKey === 'rank') {
                    va = Number(va);
                    vb = Number(vb);
                } else if (sortKey === 'birth') {
                    va = new Date(va);
                    vb = new Date(vb);
                } else {
                    va = String(va).toLowerCase();
                    vb = String(vb).toLowerCase();
                }
                if (va < vb) return sortAsc ? -1 : 1;
                if (va > vb) return sortAsc ? 1 : -1;
                return 0;
            });

            currentData = filtered;
            renderStats(filtered);
            renderTable(filtered);
            updateCharts(filtered);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CHARTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let gradeChartInstance = null;
        let mentionChartInstance = null;

        function updateCharts(data) {
            // ── Grade distribution (bins) ──
            const bins = [
                { label: '8–9', min: 8, max: 9 },
                { label: '9–10', min: 9, max: 10 },
                { label: '10–11', min: 10, max: 11 },
                { label: '11–12', min: 11, max: 12 },
                { label: '12–13', min: 12, max: 13 },
                { label: '13–14', min: 13, max: 14 },
                { label: '14–15', min: 14, max: 15 },
                { label: '15–16', min: 15, max: 16 },
            ];
            const counts = bins.map(b => data.filter(d => d.grade >= b.min && d.grade < b.max).length);

            const ctx1 = document.getElementById('gradeChart').getContext('2d');
            if (gradeChartInstance) gradeChartInstance.destroy();
            gradeChartInstance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: bins.map(b => b.label),
                    datasets: [{
                        label: 'Élèves',
                        data: counts,
                        backgroundColor: ['#1a4b6d', '#2a6b8d', '#3a8bb0', '#5aa5c9', '#7bbcd9',
                            '#a3d0e6', '#c9e4f2', '#e2eff7'
                        ],
                        borderRadius: 6,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: ctx => `${ctx.raw} élève${ctx.raw > 1 ? 's' : ''}` } }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: '#eef3f8' } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });

            // ── Mention distribution ──
            const pass = data.filter(d => d.mention === 'مفبول').length;
            const good = data.filter(d => d.mention === 'جيد').length;

            const ctx2 = document.getElementById('mentionChart').getContext('2d');
            if (mentionChartInstance) mentionChartInstance.destroy();
            mentionChartInstance = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['مفبول (Pass)', 'جيد (Good)'],
                    datasets: [{
                        data: [pass, good],
                        backgroundColor: ['#8ab8d9', '#f9d976'],
                        borderColor: '#fff',
                        borderWidth: 3,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 16, font: { size: 12 } } },
                        tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw} (${(ctx.raw/data.length*100).toFixed(1)}%)` } }
                    },
                    cutout: '68%',
                }
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function init() {
            // Set sort default
            sortKey = 'rank';
            sortAsc = true;
            filterData();

            // ── Event listeners ──
            document.getElementById('searchInput').addEventListener('input', filterData);
            document.getElementById('mentionFilter').addEventListener('change', filterData);
            document.getElementById('minGradeFilter').addEventListener('input', filterData);
            document.getElementById('resetFilters').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('mentionFilter').value = 'all';
                document.getElementById('minGradeFilter').value = '';
                sortKey = 'rank';
                sortAsc = true;
                filterData();
            });

            // ── Table header sorting ──
            document.querySelectorAll('thead th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const key = th.dataset.sort;
                    if (sortKey === key) {
                        sortAsc = !sortAsc;
                    } else {
                        sortKey = key;
                        sortAsc = true;
                    }
                    filterData();
                });
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
